[versions]
agp                      = "8.5.2"
android-compileSdk       = "35"
android-minSdk           = "26"
android-targetSdk        = "35"
kotlin                   = "2.0.21"
compose-multiplatform    = "1.7.1"
androidx-activityCompose = "1.9.3"
androidx-lifecycle       = "2.8.6"
coil                     = "3.0.4"
koin                     = "4.0.0"
kotlinx-coroutines       = "1.9.0"
kotlinx-serialization    = "1.7.3"
ktor                     = "3.0.1"
maps-compose             = "6.1.0"
multiplatform-settings   = "1.2.0"
navigation-compose       = "2.8.0-alpha13"
play-services-maps       = "19.0.0"
play-services-location   = "21.3.0"
sqldelight               = "2.0.2"
supabase                 = "3.0.0"
buildconfig              = "5.4.0"

[libraries]
# AndroidX
androidx-activity-compose        = { module = "androidx.activity:activity-compose",              version.ref = "androidx-activityCompose" }
lifecycle-viewmodel              = { module = "androidx.lifecycle:lifecycle-viewmodel",           version.ref = "androidx-lifecycle" }
lifecycle-viewmodel-compose      = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",   version.ref = "androidx-lifecycle" }
lifecycle-runtime-compose        = { module = "androidx.lifecycle:lifecycle-runtime-compose",     version.ref = "androidx-lifecycle" }

# Coil (image loading)
coil-compose                     = { module = "io.coil-kt.coil3:coil-compose",                   version.ref = "coil" }
coil-network-ktor                = { module = "io.coil-kt.coil3:coil-network-ktor3",              version.ref = "coil" }

# Koin (DI — multiplatform)
koin-android                     = { module = "io.insert-koin:koin-android",                      version.ref = "koin" }
koin-core                        = { module = "io.insert-koin:koin-core",                         version.ref = "koin" }
koin-compose                     = { module = "io.insert-koin:koin-compose",                      version.ref = "koin" }
koin-compose-viewmodel           = { module = "io.insert-koin:koin-compose-viewmodel",            version.ref = "koin" }

# Coroutines
kotlinx-coroutines-core          = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",   version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android       = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",version.ref = "kotlinx-coroutines" }

# Serialization
kotlinx-serialization-json       = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",version.ref = "kotlinx-serialization" }

# Ktor (Supabase transport)
ktor-client-core                 = { module = "io.ktor:ktor-client-core",                         version.ref = "ktor" }
ktor-client-android              = { module = "io.ktor:ktor-client-android",                      version.ref = "ktor" }
ktor-client-darwin               = { module = "io.ktor:ktor-client-darwin",                       version.ref = "ktor" }
ktor-client-content-negotiation  = { module = "io.ktor:ktor-client-content-negotiation",          version.ref = "ktor" }
ktor-client-logging              = { module = "io.ktor:ktor-client-logging",                      version.ref = "ktor" }
ktor-serialization-kotlinx-json  = { module = "io.ktor:ktor-serialization-kotlinx-json",          version.ref = "ktor" }

# Maps (Android only — iOS uses MapKit via actual)
maps-compose                     = { module = "com.google.maps.android:maps-compose",             version.ref = "maps-compose" }
play-services-maps               = { module = "com.google.android.gms:play-services-maps",        version.ref = "play-services-maps" }
play-services-location           = { module = "com.google.android.gms:play-services-location",    version.ref = "play-services-location" }

# Multiplatform Settings (DataStore/NSUserDefaults wrapper)
multiplatform-settings           = { module = "com.russhwolf:multiplatform-settings",             version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines= { module = "com.russhwolf:multiplatform-settings-coroutines",  version.ref = "multiplatform-settings" }

# Navigation (KMP-ready via JetBrains fork)
navigation-compose               = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# SQLDelight
sqldelight-android-driver        = { module = "app.cash.sqldelight:android-driver",               version.ref = "sqldelight" }
sqldelight-native-driver         = { module = "app.cash.sqldelight:native-driver",                version.ref = "sqldelight" }
sqldelight-runtime               = { module = "app.cash.sqldelight:runtime",                      version.ref = "sqldelight" }
sqldelight-coroutines            = { module = "app.cash.sqldelight:coroutines-extensions",        version.ref = "sqldelight" }

# Supabase Kotlin SDK (uses Ktor under the hood)
supabase-bom                     = { module = "io.github.jan-tennert.supabase:bom",               version.ref = "supabase" }
supabase-auth                    = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest               = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-storage                 = { module = "io.github.jan-tennert.supabase:storage-kt" }

[plugins]
androidApplication               = { id = "com.android.application",                             version.ref = "agp" }
androidLibrary                   = { id = "com.android.library",                                  version.ref = "agp" }
jetbrainsCompose                 = { id = "org.jetbrains.compose",                                version.ref = "compose-multiplatform" }
compose-compiler                 = { id = "org.jetbrains.kotlin.plugin.compose",                  version.ref = "kotlin" }
kotlinMultiplatform              = { id = "org.jetbrains.kotlin.multiplatform",                   version.ref = "kotlin" }
kotlinSerialization              = { id = "org.jetbrains.kotlin.plugin.serialization",            version.ref = "kotlin" }
sqldelight                       = { id = "app.cash.sqldelight",                                  version.ref = "sqldelight" }
googleServices                   = { id = "com.google.gms.google-services",                       version = "4.4.2" }
buildconfig                      = { id = "com.github.gmazzo.buildconfig",                        version.ref = "buildconfig" }
