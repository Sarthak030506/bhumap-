# AndroidX package structure to make it clearer which packages are bundled with the Android operating system
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Suppress compileSdk 35 warning for AGP 8.5.2
android.suppressUnsupportedCompileSdk=35
# Faster R class compilation
android.nonTransitiveRClass=true
# JVM arguments for the Gradle Daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
